name: Enriquecer detalle Mercado Público

# Detalle: cada 6 min (min 3,9,15…) — nunca en :00 cuando corre listados
on:
  schedule:
    - cron: "3,9,15,21,27,33,39,45,51,57 * * * *"
  workflow_dispatch:

concurrency:
  group: mercado-publico-api
  cancel-in-progress: false

jobs:
  sync-detalle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Enriquecer detalles pendientes
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMITE: "12"
          PAUSA_MS: "10000"
        run: |
          INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "=== Enriquecer detalle ${INICIO} (limite=${LIMITE}) ==="

          HTTP_CODE=$(curl -sS -w "%{http_code}" -o response.json \
            "${APP_URL}/api/sync/enriquecer-detalle?secret=${CRON_SECRET}&limite=${LIMITE}&pausaMs=${PAUSA_MS}")

          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Enriquecer detalle falló (HTTP ${HTTP_CODE})"
            cat response.json
            exit 1
          fi

          echo "Procesados: $(jq -r '.total // 0' response.json)"
          jq -r '.procesados[]? | (if .ok then "✓" else "✗" end) + " [\(.modulo)] \(.codigo) \(.detalle)"' response.json

          {
            echo "## Enriquecer detalle — ${INICIO}"
            echo "| Módulo | Código | Detalle | OK |"
            echo "|--------|--------|---------|-----|"
            jq -r '.procesados[]? | "| \(.modulo) | \(.codigo) | \(.detalle) | \(if .ok then "✓" else "✗" end) |"' response.json
          } >> "$GITHUB_STEP_SUMMARY"
